name: Build AndroLinux Native Runtime APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: oonid/pr
          path: native-runtime
      - name: Fetch runtime submodules
        working-directory: native-runtime
        run: |
          git -c url."https://github.com/".insteadOf=git@github.com: submodule update --init --depth 1 vendor/samba vendor/termlib
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android
      - name: Install NDK and link for Rust
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          mkdir -p native-runtime/build/ndk
          ln -s "$ANDROID_HOME/ndk/27.2.12479018" native-runtime/build/ndk/android-ndk-r27c
      - name: Build patched PRoot
        working-directory: native-runtime
        run: ./scripts/build.sh --arch=arm64 --ndk-path="$ANDROID_HOME/ndk/27.2.12479018"
      - name: Build Rust Linux command-line runtime
        working-directory: native-runtime
        run: ./scripts/build-pr-cli.sh
      - name: Embed PRoot in APK
        run: |
          cp native-runtime/build/out/arm64/proot native-runtime/android/proot-engine/src/main/jniLibs/arm64-v8a/libproot.so
          cp native-runtime/build/out/arm64/loader native-runtime/android/proot-engine/src/main/jniLibs/arm64-v8a/libproot-loader.so
      - uses: gradle/actions/setup-gradle@v4
      - name: Fix unavailable upstream Kotlin plugin versions
        run: |
          sed -i 's/version "2.4.21"/version "2.2.21"/g' native-runtime/android/build.gradle.kts
          grep -n 'kotlin' native-runtime/android/build.gradle.kts
      - name: Build Android APK
        working-directory: native-runtime/android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify APK
        run: test -s native-runtime/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AndroLinux-Native-ARM64-APK
          path: native-runtime/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
