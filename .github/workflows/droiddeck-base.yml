name: Build DroidDeck-based Plasma APK (experimental)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout DroidDeck upstream base
        uses: actions/checkout@v4
        with:
          repository: Droid-Deck/DroidDeck
          ref: main
          submodules: recursive
          fetch-depth: 1
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd golang-go python3 docker.io gh
          rustup target add aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "platform-tools"
      - name: Build original DroidDeck runtime and Plasma application
        env:
          DROIDDECK_BUILD_VARIANT: debug
          DROIDDECK_NDK_VERSION: 27.2.12479018
          DROIDDECK_GITHUB_REPOSITORY: Droid-Deck/DroidDeck
        run: bash tools/build_local.sh
      - name: Upload experimental DroidDeck-base APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidDeck-Base-Plasma-Experimental
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
